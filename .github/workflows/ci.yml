name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run analyzer tests
        run: node tests/analyzer.test.js

      - name: Run storage tests
        run: node tests/storage.test.js

      - name: Run registry tests
        run: node tests/registry.test.js

      - name: Run scheduler tests
        run: node tests/scheduler.test.js

      - name: Run usage tracker tests
        run: node tests/usage-tracker.test.js

      - name: Run gateway tests
        run: node tests/gateway.test.js

      - name: Run WASM sandbox tests
        run: node tests/wasm-sandbox.test.js

      - name: Run capability tests
        run: node tests/capabilities.test.js

      - name: Run shell version tests
        run: node tests/shell-versions.test.js

      - name: Run syscall tests (HTTP guard, VFS, net proxy, sandbox)
        run: node tests/syscalls.test.js

      - name: Run Claude provider tests
        run: node tests/claude-provider.test.js

      - name: Run theme tests
        run: node tests/theme.test.js

      - name: Run portable UI tests
        run: node tests/portable-ui.test.js

      - name: Run desktop layout tests
        run: node tests/desktop.test.js

      - name: Run boot report tests
        run: node tests/boot.test.js

      - name: Run data format migration tests
        run: node tests/migrations.test.js

      - name: Run display setting tests
        run: node tests/display.test.js

      - name: Run data disk tests (real ext4 mounts on loop devices)
        run: sudo sh tests/vm/data-disk.test.sh

  build-vm:
    name: Build VM (${{ matrix.variant }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [server, desktop, micro]
    steps:
      - uses: actions/checkout@v4

      - name: Build Alpine VM (server/desktop)
        if: matrix.variant != 'micro'
        run: |
          docker build -f build/Dockerfile.iso -t llmos-builder .
          mkdir -p build/output
          docker run --rm --privileged \
            -e VARIANT=${{ matrix.variant }} \
            -v ${{ github.workspace }}/build/output:/output \
            llmos-builder

      - name: Build Buildroot VM (micro)
        if: matrix.variant == 'micro'
        run: |
          docker build -f build/Dockerfile.buildroot -t llmos-buildroot .
          mkdir -p build/output
          docker run --rm --privileged \
            -v ${{ github.workspace }}/build/output:/output \
            llmos-buildroot

      - name: List output
        run: ls -lh build/output/

      # Nothing is released that doesn't boot, keep its data across an
      # upgrade, and shut down when the hypervisor asks.
      - name: Boot test (QEMU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          IMG=$(ls build/output/*.qcow2 | head -1)
          sh build/test/vm-boot-test.sh "$IMG" ${{ matrix.variant == 'micro' && 300 || 900 }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmos-${{ matrix.variant }}
          path: build/output/*

  release:
    name: Create Release
    needs: build-vm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: llmos-server
          path: release/

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: llmos-desktop
          path: release/

      - name: Download micro artifacts
        uses: actions/download-artifact@v4
        with:
          name: llmos-micro
          path: release/

      # An empty data disk, the same for every version. Attach it as a second
      # disk: user data lives there (see build/rootfs/usr/local/bin/llmos-data-setup),
      # so upgrading means swapping only the OS disk.
      - name: Create empty data disk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils e2fsprogs
          truncate -s 8G data.img
          mkfs.ext4 -q -L LLMOSDATA -m 0 data.img
          qemu-img convert -c -O qcow2 data.img release/llmos-data.qcow2
          qemu-img convert -O vhdx -o subformat=dynamic data.img release/llmos-data.vhdx
          qemu-img convert -O vmdk -o subformat=streamOptimized data.img release/llmos-data.vmdk
          rm data.img

      - name: List release files
        run: ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
